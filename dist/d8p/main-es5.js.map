<div>
    <button class="d8p-handburger" mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
        <mat-icon>menu</mat-icon>
    </button>
    <!-- Nav block - start -->
      <mat-sidenav-container>
        <mat-sidenav #sidenav>
            <mat-nav-list>
                <div class="mt-4" mat-list-item routerLink="/recent-transactions"><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-inbox.svg" /></small>Recent transaction</div>
                <div class="mt-2" mat-list-item><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-logout.svg" /></small>Logout</div>
              </mat-nav-list>
        </mat-sidenav>
        <!-- Nav block - end -->
        <mat-sidenav-content fxFlexFill>
          <div class="container-fluid p-0">
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box">
                  <app-dashboard-header></app-dashboard-header>
                </div>
              </div>
            </div>
            
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9"> 
                <div class="dashboard-content-box">
                  <!-- Transfer -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">

                            <div class="col-12 col-xl-9 titlebg">

                          </div>
                          <div class="row no-gutters mt-2 mb-4">
                            <div class="col-12">
                                <div class="d8p-transaction-list">
                                    <ul>
                                        <li>
                                            <div class="d8p-h6 font-weight-bold">20 May</div>
                                            <ul class="d8p-txn">

                                                    <div class="container-fluid p-0">
                                                        <div class="row no-gutters">

                                                            </div>
                                                            <div class="col-8">
                                                                <div class="d8p-normal-text font-weight-bold color-black">Rosli</div>
                                                                <div class="d8p-normal-text overflow-dots">You just received RM 1000  conversion</div>
                                                            </div>
                                                            <div class="col-2">
                                                                <div class="d8p-smaller-text font-weight-bold text-right whitespace-nowrap">06: 00 : AM</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                                
                                            </ul>
                                        </li>
                                        <li>
                                            <div class="d8p-h6 font-weight-bold">18 Apr</div>
                                            <ul class="d8p-txn">
                                                <li>
                                                    <div class="container-fluid p-0">
                                                        <div class="row no-gutters">

                                                                <img src='assets/icons-img/dollar-icon-green.svg' />
                                                            </div>
                                                            <div class="col-8">
                                                                <div class="d8p-normal-text font-weight-bold color-black">Rosli</div>
                                                                <div class="d8p-normal-text overflow-dots">You just received RM 1000  conversion</div>
                                                            </div>
                                                            <div class="col-2">
                                                                <div class="d8p-smaller-text font-weight-bold text-right whitespace-nowrap">06: 00 : AM</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>
                                                
                                            </ul>
                                        </li>
                                        <li>

                                            <ul class="d8p-txn">

                                                                <div class="d8p-normal-text overflow-dots">You just received RM 1000  conversion</div>
                                                            </div>
                                                            <div class="col-2">
                                                                <div class="d8p-smaller-text font-weight-bold text-right whitespace-nowrap">06: 00 : AM</div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </li>

<div>
  <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
  <label class="handburger" for="myInput">
    <span class="bar top"></span>
    <span class="bar middle"></span>
    <span class="bar bottom"></span>
  </label>
  <!-- Nav block - start -->
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" position="end">
      <mat-nav-list>
        <app-matsidenav></app-matsidenav>
      </mat-nav-list>
    </mat-sidenav>
    <!-- Nav block - end -->
    <mat-sidenav-content fxFlexFill>
      <div class="container-fluid p-0">
        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <app-split-header></app-split-header>
          </div>
        </div>
        <div class="container-fluid quicklinkbg">
          <div class="row no-gutters">
            <div class="col-12">
              <div class="container-fluid p-0 menu-grid">
                <div class="row no-gutters justify-content-center">
                  <div class="col-12 col-xl-9 titlebg">
                    Menu
                  </div>
                </div>
                <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5 flex-valign-75">
                  <div class="col-3 flex-align-center flex-column border-right-white">
                  </div>
                  <div class="col-9 pl-3 color-white font-size-15">
                    Your menu page is where you can manage all the items that you offer to your customers. You can add new items, edit existing ones, and remove items that are no longer available.
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- page start-->


        <div class="panel-body">
          <div class="adv-table editable-table">
            <div class="clearfix">
              <div class="btn-group">
                <button class="d8p-btn-menu mt-3 margin-left-20" (click)="addNewItem()">
                  Add Menu
                  <i class="fa fa-plus"></i>
                </button>
              </div>
              <div class="btn-group pull-right">
              </div>
            </div>
          </div>
        </div>
        <div>
          <div class="table_responsive">
            <table style="font-size: 0.8em; text-align: center;">
              <thead>
                  <tr>
                      <th style="padding: 0.2em;">Item</th>
                      <th style="padding: 0.2em;">Price RM</th>
                      <th style="padding: 0.2em;">Date</th>
                      <th style="padding: 0.2em;">Actions</th>
                  </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let item of items">
                      <td style="padding: 0.2em;"><input type="text" [(ngModel)]="item.item" [disabled]="!item.editMode" style="width: 100%; padding: 0.2em; text-align: center;"></td>
                      <td style="padding: 0.2em;"><input type="text" [(ngModel)]="item.price" appCurrencyFormat [disabled]="!item.editMode" style="width: 100%; padding: 0.2em; text-align: center;"></td>
                      <td style="padding: 0.2em;"><input type="date" [min]="minDate" [value]="defaultDate" max="2090-01-01"></td>
                      <!-- <td style="padding: 0.2em;">
                          <select [(ngModel)]="item.day" [disabled]="!item.editMode" style="width: 100%; padding: 0.2em; border: none; background-color: #fff; color: #000; appearance: none;">
                              <option value="Monday">Mon</option>
                              <option value="Tuesday">Tues</option>
                              <option value="Wednesday">Wed</option>
                              <option value="Thursday">Thurs</option>
                              <option value="Friday">Fri</option>
                              <option value="Saturday">Sat</option>
                              <option value="Sunday">Sun</option>
                          </select>
                      </td> -->
                      <td style="padding: 0.2em;">
                          <span class="action_btn" style="display: flex; justify-content: center;">
                              <button class="edit-btn" *ngIf="!item.editMode" (click)="toggleEditMode(item)" style="padding: 0.2em; text-align: left;">Edit</button>
                              <button class="save-btn" *ngIf="item.editMode" (click)="saveItem(item)" style="padding: 0.2em;">Save</button>
                              <button class="delete-btn" *ngIf="!item.editMode" (click)="deleteItem(item)" style="padding: 0.2em;">Delete</button>
                              <button class="cancel-btn" *ngIf="item.editMode && !this.editClicked" (click)="deleteItem(item)" style="padding: 0.2em;">Cancel</button>
                          </span>
                      </td>
                  </tr>
              </tbody>
          </table>

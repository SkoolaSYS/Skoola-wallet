<div class="skoola-login-page">

  <div class="skoola-login-container">

    <!-- Logo -->
    <div class="logo-section">
      <img
        src="assets/logo-img/skoola-logo.png"
        alt="Skoola"
        class="skoola-logo"
      />
    </div>

    <!-- Welcome -->
    <div class="welcome-section">
      <h1>Welcome Back!</h1>
      <p>
        Login to access your children's<br />
        school e-wallet.
      </p>
    </div>

    <!-- Login Form -->
    <form
      #loginForm="ngForm"
      (ngSubmit)="submit()"
      autocomplete="off"
      class="login-form"
    >

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>

        <div class="input-wrapper">

            <span class="field-icon">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                <path d="M3 7l9 6 9-6"></path>
            </svg>
            </span>

            <input
            id="email"
            type="email"
            name="email"
            [(ngModel)]="services.username"
            placeholder="Enter your email"
            required
            autocomplete="email"
            />

        </div>
        </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>

        <div class="input-wrapper">

            <span class="field-icon">
            <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
            >
                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            </svg>
            </span>

            <input
            id="password"
            [type]="hide ? 'password' : 'text'"
            name="password"
            [(ngModel)]="services.password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
            />

            <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
            aria-label="Show or hide password"
            >
            <i
                class="bi"
                [ngClass]="hide ? 'bi-eye-slash' : 'bi-eye'"
            ></i>
            </button>

        </div>
        </div>

      <!-- Remember / Forgot -->
      <div class="login-options">

        <label class="remember-me">
          <input
            type="checkbox"
            name="rememberMe"
          />
          <span>Remember me</span>
        </label>

        <a
          class="forgot-password"
          href="javascript:void(0)"
        >
          Forgot Password?
        </a>

      </div>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="error-message"
      >
        {{ errorMessage }}
      </div>

      <!-- Login -->
      <button
        type="submit"
        class="login-button"
        [disabled]="loading || loginForm.invalid"
      >

        <span *ngIf="!loading">
          Login
        </span>

        <span *ngIf="loading">
          Signing in...
        </span>

      </button>

    </form>

    <!-- Footer -->
    <div class="login-footer">
      <span>Secure access to your child's school wallet</span>
    </div>

  </div>

  <ngx-spinner
    size="medium"
    color="#ffffff"
    type="ball-spin-clockwise"
  >
    <p class="spinner-text">Please wait...</p>
  </ngx-spinner>

</div>

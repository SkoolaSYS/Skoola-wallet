                          <form (submit)="submit()" autocomplete="off">
                            <div class="formfield max-width-100">
                                <div class="input-group mb-3 mt-4 group-input-border-radius">
                                    <input type="text" placeholder="Username" [(ngModel)]="username" name="username" class="form-control" />
                                </div>
                                <div class="input-group mt-4 mb-3 group-input-border-radius">
                                    <input [type]="hide ? 'password' : 'text'" placeholder="Password" [(ngModel)]="password" name="password" class="form-control" />
                                        <i style="margin-top: 18px; z-index: 10;" class="bi-eye-slash" id="togglePassword" (click)="togglePassword()"></i>
                                    <div class="input-group-append">
                                        <span class="input-group-text group-input-icon-field" id="basic-addon2">

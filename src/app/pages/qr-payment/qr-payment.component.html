<div>
    <!-- <button class="d8p-handburger" mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
        <mat-icon>menu</mat-icon>
    </button> -->
    <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
    <label class="handburger" for="myInput">
            <span class="bar top"></span>
            <span class="bar middle"></span>
            <span class="bar bottom"></span>
    </label>
    <!-- Nav block - start -->
      <mat-sidenav-container>
        <mat-sidenav #sidenav mode="over" position="end">
          <mat-nav-list>
            <app-matsidenav></app-matsidenav>
          </mat-nav-list>
        </mat-sidenav>
        <!-- Nav block - end -->
        <mat-sidenav-content fxFlexFill>
          <div class="container-fluid p-0">
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box" *ngIf="!isMerchant">
                  <app-dashboard-header></app-dashboard-header>
                </div>
              </div>
            </div>
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box" *ngIf="isMerchant">
                  <app-split-header></app-split-header>
                </div>
              </div>
            </div>
            
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-content-box pb-5">
                  <!-- Quick links -->
                  <div class="container-fluid quicklinkbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              QR PAYMENT
                            </div>
                          </div>
                          <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5">
                            <div class="row no-gutters justify-content-center">
                            <div class="col-9 pl-3 color-white font-size-15">
                                Funds residing in my D-8P Account MYR e-Wallet will be transferred to merchant recipient's D-8P Account.
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <form novalidate #form="ngForm">
                  <!-- Merchant -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Merchant's Name
                            </div>
                          </div>
                          <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                              <!-- to do ( show the merchant name )-->
                               <body class="col-10" style="text-align: center;">
                                <h1 class="d8p-form d8p-input-normal w-100 text-transform-uppercase" readonly type="text" style="color:rgb(1, 1, 2);font-size:23px;font-family:'sans-serif'">{{merchantName}}</h1>
                               </body>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                   <!-- Amount -->
                   <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Amount (RM)
                            </div>
                          </div>
                          <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10" style="text-align: center;">
                              <input class="d8p-form d8p-input-normal" placeholder="Ex: 100" type="number" name="transfer-amount" [(ngModel)]="amount" required/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Effective Date -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Effective Date
                            </div>
                          </div>
                          <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10" style="text-align: center;">
                              <input class="d8p-form d8p-input-normal w-100 text-transform-uppercase" readonly type="text" name="effectiveDate" [(ngModel)]="effectiveDate"/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Confirmation -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Confirmation
                            </div>
                            <br><br>
                            <div class="row no-gutters justify-content-center">
                              <div class="col-12">
                                <div class="button-container text-center mt-2">
                                  <a class="d8p-btn-default mt-3" (click)="onSubmit()">
                                    <div class="--text">Confirm</div>
                                    <div class="--icon"><img class="p-1 max-width-30-px"
                                        src="assets/icons-img/tick-only-signup@2x.png" /></div>
                                  </a>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  </form>
                  
                </div>

              </div>
            </div>
          </div>

        </mat-sidenav-content>
      </mat-sidenav-container>
</div>

<ngx-spinner size="medium" color="#fff" type="ball-spin-clockwise">
  <p style="font-size: 20px; color: white">Please wait...</p>
</ngx-spinner>

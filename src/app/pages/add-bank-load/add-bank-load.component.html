<div>
  <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
  <label class="handburger" for="myInput">
    <span class="bar top"></span>
    <span class="bar middle"></span>
    <span class="bar bottom"></span>
  </label>
  <!-- Nav block - start -->
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" position="end">
      <mat-nav-list>
        <app-matsidenav></app-matsidenav>
      </mat-nav-list>
    </mat-sidenav>
    <!-- Nav block - end -->
    <mat-sidenav-content fxFlexFill>
      <div class="container-fluid p-0">
        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="id-dashboardheader">
              <!-- Dashboard Header Start -->
              <app-mini-dashboard-header></app-mini-dashboard-header>
              <!-- Dashboard Header End -->
            </div>
          </div>
        </div>

        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="id-contentbox pb-5">
              <div class="id-body">
                <div class="container-fluid p-0 menu-grid">
                  <div class="modal-title text-center mb-2" style="height: 50px;">
                    Bank Load Account Settings
                  </div>
                </div>
                <div class="text-center mt-2 mb-2">
                  Country
                </div>
                <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">
                  <select class="d8p-input-form d8p-input-normal" placeholder="" type="text" name="Bank-Account-Country" [(ngModel)]="bankFormCountry"  required >
                    <option value="MY" >Malaysia</option>
                  </select>
                </div>
                <div class="text-center mt-2 mb-2">
                  Bank Name
                </div>
                <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">
                  <select class="d8p-input-form d8p-input-normal" placeholder="" type="text" name="Bank-Name" [(ngModel)]="bankFormName" required>
                    <option value="null" disabled>Select Bank</option>
                    <option *ngFor="let bank of banks" [value]="bank.id" [disabled]="bank.disabled">
                      {{bank.name}}
                    </option>
                  </select>
                </div>
                <div class="text-center mt-2 mb-2">
                  Bank Account Name
                </div>
                <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">
                  <input class="d8p-input-form d8p-input-normal" placeholder="Bank Account Name" type="text" name="Bank-Account-Name" [(ngModel)]="bankFormAccName" required/>
                </div>
                <div class="text-center mt-2 mb-2">
                  Bank Account Number
                </div>
                <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">                                
                  <input class="d8p-input-form d8p-input-normal" placeholder="Bank Account Number" type="text" name="Bank-Account-Number" [(ngModel)]="bankFormAccNumber" required/>
                </div>

                <!-- Confirmation -->
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12">
                            <div class="button-container text-center mt-2" style="height: 90px;">
                              <a class="d8p-btn-default mt-3 margin-left-95"
                                (click)="doAddBank(bankFormName,bankFormAccName,bankFormAccNumber)">
                                <div class="--text">Confirm</div>
                                <div class="--icon"><img class="p-1 max-width-30-px"
                                    src="assets/icons-img/tick-only-signup@2x.png" /></div>
                              </a>
                            </div>
                          </div>
                        </div>

               </div>
            </div>
          </div>
        </div>
      </div>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ngx-spinner size="medium" color="#fff" type="ball-spin-clockwise">
  <p style="font-size: 20px; color: white">Please wait...</p>
</ngx-spinner>

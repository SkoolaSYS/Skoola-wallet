<div>
    <button class="d8p-handburger" mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
      <mat-icon>
        <svg width="25" height="45">
          <path d="M0,3 25,3" stroke="#fff" stroke-width="3"/>
          <path d="M0,12 25,12" stroke="#fff" stroke-width="3"/>
          <path d="M0,21 25,21" stroke="#fff" stroke-width="3"/>
      </svg>
      </mat-icon>
    </button>
    <!-- Nav block - start -->
      <mat-sidenav-container>
        <mat-sidenav #sidenav mode="over" position="end">
          <mat-nav-list>
            <div class="mt-4" mat-list-item routerLink="/update-profile"><small><img class="m-2 max-width-20" src="assets/icons-img/user-dp.png" /></small>Update Profile</div>
            <div class="mt-4" mat-list-item routerLink="/recent-transactions"><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-inbox.svg" /></small>Recent transaction</div>
            <div class="mt-2" mat-list-item routerLink="/login"><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-logout.svg" /></small>Logout</div>
          </mat-nav-list>
        </mat-sidenav>
        <!-- Nav block - end -->
        <mat-sidenav-content fxFlexFill>
          <div class="container-fluid p-0">
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box">
                  <app-dashboard-header></app-dashboard-header>
                </div>
              </div>
            </div>
            
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9"> 
                <div class="dashboard-content-box pb-5">
                  <!-- Quick links -->
                  <div class="container-fluid quicklinkbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              USER PROFILE
                            </div>
                          </div>
                          <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5 flex-valign-75">
                            <div class="col-md-auto text-center">
                              
                        <!-- USER IMAGE -->
                                <label >
                                    <img class="userdp" [src]="imageUrl ? imageUrl:'assets/icons-img/user-dp.png' " style="height: 4rem;width: 4rem;">
                                   <input type="file" style="display: none;" accept="image/*" (change)=onSelectedFile($event) #fileInput>
                                   <!-- <button (click)="fileInput.click()">Select File</button> -->
                                  </label>
                                  <br>
                                  <button (click)="fileInput.click()">Select File</button>
                                
                            </div>
                            <!-- <div class="col-9 pl-3 color-white font-size-15">
                                Profile: hehehe
                              </div> -->
                          </div>

                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                             
                            <!-- FORM -->
                              <form>

                                  <div class="form-group">
                                      <label class="userEmail">Email:</label>
                                      <input 
                                      id="userEmail" 
                                      type="text" 
                                      placeholder="example@example.com"
                                      class="form-control" 
                                      required 
                                      ngModel 
                                      name="userEmail" 
                                      #userEmail="ngModel">
                                      <div 
                                      class="alert alert-danger" 
                                      *ngIf="userEmail.touched && ! userEmail.valid">Fill in your email address</div>
                                  </div>
                                  <div class="form-group">
                                      <label class="phoneNo">Phone No.:</label>
                                      <input 
                                      id="phoneNo" 
                                      type="text" 
                                      placeholder="01X-1234567"
                                      class="form-control" 
                                      required 
                                      ngModel 
                                      name="phoneNo" 
                                      #phoneNo="ngModel">
                                      <div class="alert alert-danger" 
                                      *ngIf="phoneNo.touched && ! phoneNo.valid">Fill in your Phone No.</div>
                                  </div>
                                  <div class="form-group">
                                      <label class="homeAddress">Home Address:</label>
                                      <textarea 
                                      required 
                                      ngModel 
                                      name="homeAddress" 
                                      #homeAddress="ngModel" 
                                      id="homeAddress" 
                                      cols="30" 
                                      rows="3" 
                                      class="form-control"></textarea>
                                      <div class="alert alert-danger" *ngIf="homeAddress.touched && !homeAddress.valid">Fill in your Home Address</div>
                                 </div>
                                 
                                 <div class="form-group">
                                  <label class="idVerify">Government ID:</label>
                                  <input 
                                  id="idVerify" 
                                  type="text"
                                  placeholder="801202-XX-XXXX"
                                  class="form-control" 
                                  required 
                                  ngModel 
                                  name="idVerify" 
                                  #idVerify="ngModel">
                                  <div class="alert alert-danger" *ngIf="idVerify.touched && ! idVerify.valid">Fill in your Government ID</div>
                                </div>

                                <div class="form-group">
                                  <label for="idVerify">Proof of Government ID</label>
                                    <form>
                                          Front ID:
                                          <input type="file" accept="image/*" capture><br>
                                          Back ID:
                                          <input type="file" accept="image/*" capture><br>
                                          Selfie with ID:
                                          <input type="file" accept="image/*" capture><br>
                                       </form>
                                </div>

        <!-- Confirmation -->
                               <div class="container-fluid">
                                   <div class="row no-gutters">
                                    <div class="col-12">
                                      <div class="container-fluid p-0 menu-grid">
                                        <div class="row no-gutters justify-content-center mt-4 mb-4">
                                              <div class="col-10">
                                                 <div class="button-container text-center">
                                                   <button class="d8p-btn-default" routerLink="/">
                                                     Update
                                                    <span class="ml-2"><img class="p-1 max-width-25-px" src="assets/icons-img/icon-correct2.png" /></span>
                                                     </button>
                                                  </div>
                                              </div>
                                         </div>
                                     </div>
                                   </div>
                                  </div>
                              </div>
    
                          </form>
                            
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
         

                  

                  
                </div>

              </div>
            </div>
          </div>

        </mat-sidenav-content>
      </mat-sidenav-container>
</div>

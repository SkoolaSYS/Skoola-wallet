<div class="container-fluid common-cls loginpg grey-gradient p-0">
    <div class="row">
        <div class="col-12">
            <div class="login-bg">
                <div class="d8p-main-back-btn">
                    <div class="row no-gutters">
                        <div class="col-9">
                            <div class="dashboard-header">
                                <div class="text-center">
                                    <img class="logo" src="assets/icons-img/logo-title-signup@3x.png"
                                        routerLink="/login" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <img class="signupline" src="assets/icons-img/line-gradient-signup.png" />
                    <div class="login-container max-width-100 overflow-hidden">
                        <div class="logoContainer" *ngIf="spinLogo">
                            <img class="tails max-width-50" *ngIf="getSmid=='23'" src="assets/logo-img/kopama1.png" />
                            <img class="tails jaminstore max-width-60" *ngIf="getSmid=='16'" src="assets/logo-img/jaminstore1.png" />
                            <!-- <img class="tails max-width-60" *ngIf="getSmid=='153'" src="assets/logo-img/kebunkita1.png" />  -->
                            <!-- <img class="tails max-width-60" *ngIf="getSmid=='154'" src="assets/logo-img/gmi1.png" /> -->
                            <img class="heads max-width-60" src="assets/icons-img/d-8logonew-login@2x.png" />
                        </div>
                        <div class="d8p-logo" *ngIf="!spinLogo">
                            <img class="max-width-60 logoContainer" src="assets/icons-img/d-8logonew-login@2x.png" />
                        </div>

                        <form (submit)="submit()">
                            <div class="formfield max-width-100">
                                <div class="input-group mb-3 group-input-border-radius">
                                    <input type="text" class="form-control d8p-input-normal min-height-55"
                                        placeholder="Username" pattern="([A-z0-9À-ž]){2,}" maxlength="16"
                                        name="username" [(ngModel)]="services.username"
                                        aria-label="Recipient's username" aria-describedby="basic-addon2" />

                                </div>
                            </div>
                            <div class="formfield max-width-100">
                                <div class="input-group mt-4 mb-3 group-input-border-radius">
                                    <input name="pwd" type="password" class="form-control d8p-input-normal min-height-55" id="loginPassword"
                                        placeholder="Password" pattern="([A-z0-9À-ž]){2,}" maxlength="16" [(ngModel)]="services.password" autocomplete="new-password" [type]="hide ? 'password' : 'text'" /> 
                                        <!-- <i class="bi-eye-slash mt-3 mr-3" id="togglePasswordLogin" (click)="showPassword()"></i> -->
                                    
                                    <div class="input-group-append">
                                        <span class="input-group-text group-input-icon-field" id="basic-addon2">
                                            <button class="d8p-transparent-btn" *ngIf="services.password">
                                                <img class="btnicon" src="assets/icons-img/login-unlock@3x.png" />
                                            </button>
                                            <button class="d8p-transparent-btn" *ngIf="!services.password">
                                                <img class="btnicon" src="assets/icons-img/login-lock@3x.png" />
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <input type="checkbox" class="tnc-checkbox" id="showPassword" (click)="showPasswd()">
                            <span class="d8p-showpasswd-text">Show Password</span>
                        </form>
                    </div>
                    <div class="button-container text-center">
                        <a class="d8p-btn-grey-vt" routerLink="/network-participants-list">
                            <div class="--text">Network Participants List</div>
                            <div class="--icon"><img class="npl-icon max-width-30-px"
                                    src="assets/icons-img/npl-merchant-icon@3x.png" /></div>
                        </a>
                    </div>
                    <img class="signupline" src="assets/icons-img/line-gradient-login-bottom.png" />
                    <div class="sponsored text-center">
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/d-8pplus-sponsored@3x.png" />
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/short-line-gradient.png" />
                        <img class="max-width-30 mr-2 mr-xl-4 " src="assets/icons-img/komeps-sponsored@3x.png" />
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/short-line-gradient.png" />
                        <img class="max-width-20 ml-2 ml-xl-4" src="assets/icons-img/d8p-eid@2x.png" />
                    </div>
                </div>
            </div>
        </div>
    </div>
    <ngx-spinner size="medium" color="#fff" type="ball-spin-clockwise">
        <p style="font-size: 20px; color: white">Please wait...</p>
      </ngx-spinner>

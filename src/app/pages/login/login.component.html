<div class="container-fluid common-cls loginpg grey-gradient p-0">
    <div class="row">
        <div class="col-12">
            <div class="login-bg">
                <div class="d8p-main-back-btn">
                    <div class="row no-gutters">
                        <div class="col-9">
                            <div class="dashboard-header">
                                <div class="text-center">
                                    <img class="logo" src="assets/icons-img/logo-title-signup@3x.png"
                                        routerLink="/login" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <img class="signupline" src="assets/icons-img/line-gradient-signup.png" />
                    <div class="login-container max-width-100 overflow-hidden">
                        <div class="text-center mb-3">
                            <img class="max-width-60" src="assets/icons-img/d-8logonew-login@2x.png" />
                        </div>

                        <form (submit)="submit()">
                            <div class="formfield max-width-100">
                                <div class="input-group mb-3 group-input-border-radius">
                                    <input type="text" class="form-control d8p-input-normal min-height-60"
                                        placeholder="Username" pattern="([A-z0-9À-ž]){2,}" maxlength="16"
                                        name="username" [(ngModel)]="services.username"
                                        aria-label="Recipient's username" aria-describedby="basic-addon2" />
                                        <!-- <i class="bi bi-eye-slash" id="togglePassword"></i> -->

                                </div>
                            </div>
                            <div class="formfield max-width-100">
                                <div class="input-group mb-3 group-input-border-radius">
                                    <input type="password" class="form-control d8p-input-normal min-height-60" id="loginPassword"
                                        placeholder="Password" pattern="([A-z0-9À-ž]){2,}" maxlength="16" name="pwd"
                                        [(ngModel)]="services.password" aria-label="Recipient's username"
                                        aria-describedby="basic-addon2" autocomplete="new-password" /> 
                                    
                                    <div class="input-group-append">
                                        <span class="input-group-text group-input-icon-field" id="basic-addon2">
                                            <button class="d8p-transparent-btn" *ngIf="services.password">
                                                <img class="btnicon" src="assets/icons-img/login-unlock@3x.png" />
                                            </button>
                                            <button class="d8p-transparent-btn" *ngIf="!services.password">
                                                <img class="btnicon" src="assets/icons-img/login-lock@3x.png" />
                                            </button>
                                        </span>
                                    </div>
                                </div>
                            </div>
                            <input type="checkbox" class="tnc-checkbox" id="showPassword" (click)="showPasswd()">
                            <span class="d8p-showpasswd-text">Show Password</span>
                        </form>
                    </div>
                    <div class="button-container text-center">
                        <a class="d8p-btn-grey" routerLink="/network-participants-list">
                            <div class="--text">Network Participants List</div>
                            <div class="--icon"><img class="max-width-30-px"
                                    src="assets/icons-img/npl-merchant-icon.png" /></div>
                        </a>
                    </div>
                    <img class="signupline" src="assets/icons-img/line-gradient-login-bottom.png" />
                    <div class="sponsored text-center">
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/d-8pplus-sponsored@3x.png" />
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/short-line-gradient.png" />
                        <img class="max-width-30 mr-2 mr-xl-4 " src="assets/icons-img/komeps-sponsored@3x.png" />
                        <img class="max-width-20 mr-2 mr-xl-4" src="assets/icons-img/short-line-gradient.png" />
                        <img class="max-width-20 ml-2 ml-xl-4" src="assets/icons-img/d8p-eid@2x.png" />
                    </div>
                </div>
            </div>
        </div>
    </div>

<div>
    <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
    <label class="handburger" for="myInput">
        <span class="bar top"></span>
        <span class="bar middle"></span>
        <span class="bar bottom"></span>
    </label>
    <mat-sidenav-container>
        <mat-sidenav #sidenav mode="over" position="end">
            <mat-nav-list>
                <app-matsidenav></app-matsidenav>
            </mat-nav-list>
        </mat-sidenav>
        <mat-sidenav-content fxFlexFill>
            <div class="row no-gutters justify-content-center">
                <div class="col-12 col-xl-9" *ngFor="let product of data; let i = index">
                    <div class="" style="text-align: center;">
                        <img class="max-width-100" src="{{product[0].productImage}}" alt="">
                        <!-- {{product[0].productImage}} -->
                    </div>
                    <div class="d-flex justify-content-center d8p-h3">
                        {{product[0].productName}}
                    </div>
                    <div class="d-flex justify-content-center d8p-normal-text">
                        {{product[0].productDesc}}
                    </div>
                    <div class="card-footer d8p-normal-text">
                        RM {{product[0].productPrice}}
                    </div>
                    <div class="card-footer d8p-normal-text">
                        <div class="input-group">
                            <span class="input-group-text" id="{{i}}" (click)="incQuantity(i)">
                                <i class="bi bi-plus"></i>
                            </span>
                            <input type="text" class="form-control" [value]="userInput[i]" size="2" maxlength="10" readonly>
                            <span class="input-group-text" id="{{i}}" (click)="decQuantity(i)"><i
                                    class="bi bi-dash"></i></span>
                        </div>
                    </div>
                </div>
                <div class="row no-gutters justify-content-center">
                    <div class="col-12">
                        <div class="button-container text-center mt-2">
                            <button class="d8p-btn-default mt-3" id="btnConfirm" (click)="confirm()">
                                <div class="--text">Confirm</div>
                                <div class="--icon"><img class="p-1 max-width-30-px"
                                        src="assets/icons-img/tick-only-signup@2x.png" />
                                </div>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>

<div>
    <!-- Handburger Start -->
    <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
    <label class="handburger" for="myInput">
      <span class="bar top"></span>
      <span class="bar middle"></span>
      <span class="bar bottom"></span>
    </label>
    <!-- Handburger End -->
    <!-- Nav block - start -->
    <mat-sidenav-container>
      <mat-sidenav #sidenav mode="over" position="end">
        <mat-nav-list>
          <app-matsidenav></app-matsidenav>
        </mat-nav-list>
      </mat-sidenav>
      <!-- Nav block - end -->
      <mat-sidenav-content fxFlexFill>
        <div class="container-fluid p-0">
          <div class="row no-gutters justify-content-center">
            <div class="col-12 col-xl-9">
              <div class="dashboard-header-box" *ngIf="!isMerchant">
                <app-dashboard-header></app-dashboard-header>
              </div>
            </div>
          </div>
          <div class="row no-gutters justify-content-center">
            <div class="col-12 col-xl-9">
              <div class="dashboard-header-box" *ngIf="isMerchant">
                <app-split-header></app-split-header>
              </div>
            </div>
          </div>
  
          <div class="row no-gutters justify-content-center">
            <div class="col-12 col-xl-9">
              <div class="tp-contentbox">
                <div class="id-body">
                  <div class="container-fluid p-0 menu-grid">
                    <div class="modal-title text-center mt-2 mb-2">
                       Recycle Details
                      </div>
                      <div class="text-center mt-2 mb-2">
                        Merchant's Name
                      </div>
                      <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">
                        <input class="d8p-input-form d8p-input-normal" type="text" [(ngModel)]="merchantName" readonly required/>
                      </div>
                      <div class="text-center mt-2 mb-4">
                        Type of Recycle Waste
                      </div>
                      <div class="upload-part row no-gutters justify-content-center" *ngFor="let recycle of data; let i = index">
                        <span>Type of Recycle Waste: {{recycle[0].recycleWaste}}</span>
                        <span>Recycle Waste Weight(g): {{recycle[0].recycleWeight}}</span>
                      </div>
                      <div class="text-center mt-2 mb-2">
                        Amount Recycle Price
                      </div>
                      <div class="upload-part row no-gutters justify-content-center mt-4 mb-4">
                        <input class="d8p-input-form d8p-input-normal" type="number" name="transfer-amount" [(ngModel)]="amount" readonly required/>
                      </div>
                  </div>
                  <!-- Confirmation -->
                  <div class="row no-gutters justify-content-center">
                  <div class="row no-gutters justify-content-center">
                      <div class="col-12">
                        <div class="button-container text-center mt-2" style="height: 120px;">
                          <button class="d8p-btn-default mt-3" id="btnConfirm" (click)="confirm()">
                            <div class="--text">Confirm</div>
                            <div class="--icon"><img class="p-1 max-width-30-px"
                                src="assets/icons-img/tick-only-signup@2x.png" /></div>
                          </button>
                        </div>
                      </div>
                    </div>
                    </div>
                    
  
  
                </div>
              </div>
            </div>
          </div>
        </div>
  
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>

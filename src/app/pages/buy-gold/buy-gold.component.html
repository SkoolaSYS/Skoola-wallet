<div>
  <button
    class="d8p-handburger"
    mat-icon-button
    (click)="sidenav.toggle()"
    fxShow="true"
    fxHide.gt-sm
  >
    <mat-icon>menu</mat-icon>
  </button>
  <!-- Nav block - start -->
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" position="end">
      <mat-nav-list>
        <app-matsidenav></app-matsidenav>
      </mat-nav-list>
    </mat-sidenav>
    <!-- Nav block - end -->
    <mat-sidenav-content fxFlexFill>
      <div class="container-fluid p-0">
        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="dashboard-header-box">
              <app-dashboard-header></app-dashboard-header>
            </div>
          </div>
        </div>

        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="dashboard-content-box pb-5">
              <!-- Quick links -->
              <div class="container-fluid quicklinkbg greenbg-height">
                <div class="row no-gutters">
                  <div class="col-12">
                    <div class="container-fluid p-0 menu-grid">
                      <div class="row no-gutters justify-content-center">
                        <div class="col-12 col-xl-9 titlebg">BUY GOLD</div>
                      </div>
                      <div
                        class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5 flex-valign-75"
                      >
                        <div
                          class="col-3 flex-align-center flex-column border-right-white"
                        >
                          <div class="height-60 text-center">
                            <img
                              class="max-width-60"
                              src="assets/icons-img/icon-buygold2.png"
                            />
                          </div>
                        </div>
                        <div class="col-9 pl-3 color-white font-size-15">
                          Funds residing in my D-8P Acc. MYR e-Wallet will be
                          used to buy Gold that is listed in the D-8P Retail
                          Gold Exchange.
                        </div>
                      </div>

                      <div class="row no-gutters">
                        <div class="col-12">
                          <img
                            class="mw-100 mb-3 d-flex margin-zero-auto"
                            src="assets/icons-img/linewhite2.png"
                          />
                        </div>
                      </div>
                      <!-- Content title row -->
                      <div class="row no-gutters flex-valign-75 mb-md-3">
                        <div class="col-2 flex-align-center flex-column">
                          <div class="height-60 text-center">
                            <img
                              class="max-width-100"
                              src="assets/icons-img/gold-coin.png"
                            />
                          </div>
                        </div>
                        <div class="col-9 pl-3 color-white font-size-15">
                          <div class="row no-gutters">
                            <div class="col-7">
                              <div
                                class="d8p-normal-text font-size-17 font-arial color-white pt-1"
                              >
                                <div>
                                  <span class="text-shadow font-weight-bold"
                                    >D-8P</span
                                  >
                                  Retail
                                </div>
                                <div class="pt-1">Gold Exchange</div>
                              </div>
                            </div>
                            <div class="col-5">
                              <div class="pergram">
                                <div class="p-1 border-bottom-white">
                                  AVG 1 g =
                                </div>
                                <div class="p-1"><small> RM {{goldAverage}}</small></div>
                              </div>
                            </div>
                          </div>
                        </div>
                        <div class="col-1 flex-align-center flex-column">
                          <div class="height-60 text-center">
                            <img
                              class="max-width-60"
                              src="assets/icons-img/icon-info2.png"
                            />
                          </div>
                        </div>
                      </div>

                      <div class="row no-gutters flex-valign-75">
                        <div class="col-12">
                          <div class="row no-gutters">
                            <div class="col-5">
                              <select
                                class="arrowstyle-white d8p-select-white"
                                name="currency"
                                required
                                style="background-color: #eee"
                              >
                                <option>MYR</option>
                                <option>SGD</option>
                                <option>USD</option>
                              </select>
                            </div>
                            <div class="col-1"></div>
                            <div class="col-6">
                              <select
                                class="arrowstyle-white d8p-select-white"
                                name="sortby"
                                required
                                style="background-color: #eee"
                                [(ngModel)] = "order"
                                (change)="sort(order)"
                                
                              >
                                <option value="false">Cheapest</option>
                                <option value="true">Highest</option>
                              </select>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <!-- Listing Filter -->
              <div class="container-fluid">
                <div class="row no-gutters">
                  <div class="col-12">
                    <div class="container-fluid p-0 menu-grid">
                      <div class="row no-gutters justify-content-center">
                        <div class="col-12 col-xl-9 titlebg">
                          Listing Filter
                        </div>
                      </div>
                      <div class="row no-gutters justify-content-center mt-3 mb-3" *ngFor="let gold of data; let i = index" >
                        <div class="col-11 col-xl-9">
                          <div class="row no-gutters">
                            <div class="col-9">
                              <div class="d8p-h6 font-arial">
                                {{gold[0].goldAmount}} g D-8P GOLD
                              </div>
                              <div class="d8p-h6 font-arial color-cyan" >
                                RM {{gold[0].goldPrice}} | 999.9 | {{gold[0].sign}} AVG 
                              </div>
                            </div>
                            <div class="col-3 d-flex justify-content-end">
                              <button
                                class="d8p-btn-default d8p-btn-gray font-size-15" 
                                (click)="clickButton(gold[0].goldId)" 
                              >
                                Buy
                              </button>
                            </div>
                          </div>
                          <img
                            class="max-width-100"
                            src="assets/icons-img/linegrey1.png"
                          />
                        </div>
                      </div>

                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

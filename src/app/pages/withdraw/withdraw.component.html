<div>
    <button class="d8p-handburger" mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
        <mat-icon>menu</mat-icon>
    </button>
    <!-- Nav block - start -->
      <mat-sidenav-container>
        <mat-sidenav #sidenav mode="over" position="end">
          <mat-nav-list>
            <app-matsidenav></app-matsidenav>
          </mat-nav-list>
        </mat-sidenav>
        <!-- Nav block - end -->
        <mat-sidenav-content fxFlexFill>
          <div class="container-fluid p-0">
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box">
                  <app-dashboard-header></app-dashboard-header>
                </div>
              </div>
            </div>
            
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9"> 
                <div class="dashboard-content-box pb-5">
                  <!-- Quick links -->
                  <div class="container-fluid quicklinkbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              WITHDRAW
                            </div>
                          </div>
                          <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5 flex-valign-75">
                            <div class="col-3 flex-align-center flex-column border-right-white">
                              <div class="height-60 text-center"><img class="max-width-60" src="assets/icons-img/icon-withdraw2.png" /></div>
                            </div>
                            <div class="col-9 pl-3 color-white font-size-15">
                                Funds residing in my D-8P Acc. MYR e-Wallet will be withdrawn to my bank account.
                              </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Amount -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Amount (RM)
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal" placeholder="Ex: 100" type="number" [(ngModel)]="withdrawAmount" name="transfer-amount" />
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Bank Account Details -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                                Bank Account Details
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                                <div class="d8p-h6">Bank Name</div>
                                <div class="d8p-h6 text-right color-cyan ">{{bankName}}</div>
                                <img class="max-width-100" src="assets/icons-img/linegrey1.png" />
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                                <div class="d8p-h6">Bank Country</div>
                                <div class="d8p-h6 text-right color-cyan ">Malaysia</div>
                                <img class="max-width-100" src="assets/icons-img/linegrey1.png" />
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                                <div class="d8p-h6">Bank Account Name</div>
                                <div class="d8p-h6 text-right color-cyan ">{{bankAccName}}</div>
                                <img class="max-width-100" src="assets/icons-img/linegrey1.png" />
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                                <div class="d8p-h6">Bank Account Number</div>
                                <div class="d8p-h6 text-right color-cyan ">{{bankAccNumber}}</div>
                                <img class="max-width-100" src="assets/icons-img/linegrey1.png" />
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Reference -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Reference
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal" placeholder="Ex: May transfer" type="text" [(ngModel)]="withdrawalDesc" name="reference number" />
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Effective Date -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Effective Date
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal w-100 text-transform-uppercase" placeholder="Choose Transfer Date" type="text" [(ngModel)]="withdrawDate" name="transfer date" readonly/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Confirmation -->
                  <div class="container-fluid">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Confirmation
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <div class="button-container text-center">
                                <button class="d8p-btn-default" (click)="doWithdrawal()">
                                    Confirm
                                    <span class="ml-2"><img class="p-1 max-width-25-px" src="assets/icons-img/icon-correct2.png" /></span>
                                </button>
                            </div>
                          </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

        </mat-sidenav-content>
      </mat-sidenav-container>
</div>

  <p style="font-size: 20px; color: white">Please wait...</p>

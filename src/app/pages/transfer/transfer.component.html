<div>
  <button class="d8p-handburger" mat-icon-button (click)="sidenav.toggle()" fxShow="true" fxHide.gt-sm>
    <mat-icon>
      <svg width="25" height="45">
        <path d="M0,3 25,3" stroke="#fff" stroke-width="3"/>
        <path d="M0,12 25,12" stroke="#fff" stroke-width="3"/>
        <path d="M0,21 25,21" stroke="#fff" stroke-width="3"/>
    </svg>
    </mat-icon>
  </button>
  <!-- Nav block - start -->
    <mat-sidenav-container>
      <mat-sidenav #sidenav mode="over" position="end">
        <mat-nav-list>
          <div class="mt-4" mat-list-item routerLink="/update-profile"><small><img class="m-2 max-width-20" src="assets/icons-img/user-dp.png" /></small>Update Profile</div>
          <div class="mt-4" mat-list-item routerLink="/recent-transactions"><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-inbox.svg" /></small>Recent transaction</div>
          <div class="mt-2" mat-list-item routerLink="/login"><small><img class="m-2 max-width-20" src="assets/icons-img/d8p-logout.svg" /></small>Logout</div>
        </mat-nav-list>
      </mat-sidenav>
        <!-- Nav block - end -->
        <mat-sidenav-content fxFlexFill>
          <div class="container-fluid p-0">
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9">
                <div class="dashboard-header-box">
                  <app-dashboard-header></app-dashboard-header>
                </div>
              </div>
            </div>
            
            <div class="row no-gutters justify-content-center">
              <div class="col-12 col-xl-9"> 
                <div class="dashboard-content-box pb-5">
                  <!-- Quick links -->
                  <div class="container-fluid quicklinkbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              TRANSFER
                            </div>
                          </div>
                          <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5">
                            <div class="col-3 flex-align-center flex-column border-right-white mt-2">
                              <div class="height-60 text-center"><img class="max-width-60" src="assets/icons-img/icon-transfer2.png" /></div>
                            </div>
                            <div class="col-9 pl-3 color-white font-size-15 mt-3">
                                Funds residing in my D-8P Account MYR e-Wallet will be transferred to another recipient's D-8P Account MYR e-Wallet.
                              </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <form novalidate #form="ngForm">
                  <!-- Amount -->
                  <div class="container-fluid fifthbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Amount (RM)
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal w-100" placeholder="Eg: 100" type="number" name="transfer-amount" [(ngModel)]="transferForm.amount" required/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Recipient Account Number -->
                  <div class="container-fluid recipbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Recipient's Account Number
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal" placeholder="Eg: 1234567890" type="number" name="recipient-accountno" />
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <select class="d8p-select arrowstyle" name="recipient-members" [(ngModel)]="transferForm.toMemberId" (change)="memberChange()" required>
                                <option>choose favorite</option>
                                <!-- <option>Amar</option> -->
                                <!-- <option>Rosli</option> -->
                                <option *ngFor="let member of membersList" [ngValue]="member.id">
                                  {{member.name}}
                                </option>
                              </select>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  <!-- Reference -->
                  <div class="container-fluid fifthbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Reference
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal" placeholder="Eg: Pembelian bulan May" type="text" name="reference number" [(ngModel)]="transferForm.description" required/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Effective Date -->
                  <div class="container-fluid fifthbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Effective Date
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <input class="d8p-input-normal w-100 text-transform-uppercase" [(ngModel)]="transferForm.effectiveDate" placeholder="Choose Transfer Date" type="text" onMouseOver="(this.type='date')" onMouseOut="(this.type='text')"  class="form-control"/>
                            </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Confirmation -->
                  <div class="container-fluid fifthbg">
                    <div class="row no-gutters">
                      <div class="col-12">
                        <div class="container-fluid p-0 menu-grid">
                          <div class="row no-gutters justify-content-center">
                            <div class="col-12 col-xl-9 titlebg">
                              Confirmation
                            </div>
                          </div>
                          <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <div class="button-container text-center">
                                <button class="d8p-btn-default" routerLink="/transfer-details" [disabled]="form.invalid">
                                    Confirm
                                    <span class="ml-2"><img class="p-1 max-width-25-px" src="assets/icons-img/icon-correct2.png" /></span>
                                </button>
                            </div>
                          </div>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                  </form>
                  
                </div>

              </div>
            </div>
          </div>

        </mat-sidenav-content>
      </mat-sidenav-container>
</div>

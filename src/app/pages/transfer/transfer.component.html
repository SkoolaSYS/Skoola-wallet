<div>

  <input type="checkbox" id="myInput" (click)="sidenav.toggle()" style="display: none;">
  <label class="handburger" for="myInput">
          <span class="bar top"></span>
          <span class="bar middle"></span>
          <span class="bar bottom"></span>
  </label>
  <!-- Nav block - start -->
  <mat-sidenav-container>
    <mat-sidenav #sidenav mode="over" position="end">
      <mat-nav-list>

        <app-matsidenav></app-matsidenav>

      </mat-nav-list>
    </mat-sidenav>
    <!-- Nav block - end -->
    <mat-sidenav-content fxFlexFill>
      <div class="container-fluid p-0">
        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="dashboard-header-box">
              <app-dashboard-header></app-dashboard-header>
            </div>
          </div>
        </div>

        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-9">
            <div class="dashboard-content-box pb-5">
              <!-- Quick links -->
              <div class="container-fluid quicklinkbg">
                <div class="row no-gutters">
                  <div class="col-12">
                    <div class="container-fluid p-0 menu-grid">
                      <div class="row no-gutters justify-content-center">
                        <div class="col-12 col-xl-9 titlebg">
                          TRANSFER
                        </div>
                      </div>
                      <div class="row no-gutters mt-2 mt-xl-4 pb-xl-4 mb-3 mb-xl-5">
                        <div class="col-3 flex-align-center flex-column border-right-white mt-3">
                          <div class="height-60 text-center"><img class="max-width-60"
                              src="assets/icons-img/quicklinks-transfer@3x.png" /></div>
                        </div>
                        <div class="briefDescription col-9 pl-3">
                          Funds residing in my D-8P Account MYR e-Wallet will be transferred to another recipient's D-8P
                          Account MYR e-Wallet.
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <form novalidate #form="ngForm">
                <!-- Amount -->
                <div class="container-fluid fifthbg">
                  <div class="row no-gutters">
                    <div class="col-12">
                      <div class="container-fluid p-0 menu-grid">
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12 col-xl-9 titlebg">
                            Amount (RM)
                          </div>
                        </div>
                        <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                          <div class="col-10">
                            <input class="forminput d8p-input-normal" placeholder="Eg: RM100" type="number"
                              name="transfer-amount" [(ngModel)]="transferForm.amount" required />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- Recipient Account Number -->
                <div class="container-fluid fifthbg">
                  <div class="row no-gutters">
                    <div class="col-12">
                      <div class="container-fluid p-0 menu-grid">
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12 col-xl-9 titlebg">
                            Recipient's Account Number
                          </div>
                        </div>
                        <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                          <div class="col-10">
                            <input class="forminput d8p-input-normal" placeholder="Eg: 60015803802" type="number"
                              name="recipient-accountno" [(ngModel)]="transferForm.toAccountNo" />
                          </div>
                        </div>
                        <div class="row no-gutters justify-content-center mt-4 mb-4">
                          <div class="col-10">
                            <select class="d8p-select arrowstyle" name="recipient-members"
                              [(ngModel)]="transferForm.toMemberId" style="display:none;">
                              <option>choose favorite</option>
                              <!-- <option>Amar</option> -->
                              <!-- <option>Rosli</option> -->
                              <option *ngFor="let member of membersList" [ngValue]="member.id">
                                {{member.name}}
                              </option>
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                <!-- Reference -->
                <div class="container-fluid fifthbg">
                  <div class="row no-gutters">
                    <div class="col-12">
                      <div class="container-fluid p-0 menu-grid">
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12 col-xl-9 titlebg">
                            Reference
                          </div>
                        </div>
                        <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                          <div class="col-10">
                            <input class="forminput d8p-input-normal" placeholder="Eg: January Transfer" type="text"
                              name="reference number" [(ngModel)]="transferForm.description" required />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Effective Date -->
                <div class="container-fluid fifthbg">
                  <div class="row no-gutters">
                    <div class="col-12">
                      <div class="container-fluid p-0 menu-grid">
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12 col-xl-9 titlebg">
                            Effective Date
                          </div>
                        </div>
                        <div class="formPlaceholder row no-gutters justify-content-center mt-4 mb-4">
                          <div class="col-10">
                            <input class="forminput d8p-input-normal w-100 text-transform-uppercase" readonly
                              name="effectiveDate" [(ngModel)]="transferForm.effectiveDate"
                              placeholder="Choose Transfer Date" type="text" class="form-control" />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <!-- Confirmation -->
                <div class="container-fluid fifthbg">
                  <div class="row no-gutters">
                    <div class="col-12">
                      <div class="container-fluid p-0 menu-grid">
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12 col-xl-9 titlebg">
                            Confirmation
                          </div>
                        </div>
                        <!-- <div class="row no-gutters justify-content-center mt-4 mb-4">
                            <div class="col-10">
                              <div class="button-container text-center">
                                <button class="d8p-btn-default" (click)="getReceiverDetails();" [disabled]="form.invalid">
                                    Confirm
                                    <span class="ml-2"><img class="p-1 max-width-25-px" src="assets/icons-img/icon-correct2.png" /></span>
                                </button>
                            </div>
                          </div>
                          </div> -->
                        <div class="row no-gutters justify-content-center">
                          <div class="col-12">
                            <div class="button-container text-center mt-2">
                              <a class="d8p-btn-default mt-3 margin-left-73" (click)="getReceiverDetails();">
                                <div class="--text">Confirm</div>
                                <div class="--icon"><img class="p-1 max-width-30-px"
                                    src="assets/icons-img/tick-only-signup@2x.png" /></div>
                              </a>
                            </div>
                          </div>
                        </div>


                      </div>
                    </div>
                  </div>
                </div>
              </form>

            </div>

          </div>
        </div>
      </div>

    </mat-sidenav-content>
  </mat-sidenav-container>
</div>

<ngx-spinner size="medium" color="#fff" type="ball-spin-clockwise">
  <p style="font-size: 20px; color: white">Please wait...</p>
</ngx-spinner>

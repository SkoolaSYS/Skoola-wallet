<div class="container-fluid p-0 transactionview">
  <div class="row no-gutters justify-content-center">
    <div class="col-12 col-xl-9">
      <div class="row no-gutters">
        <div class="col-3 flex-align-center text-center flex-column">
          <div class="d8p-h6 font-weight-bold color-white mb-1">SELLER</div>

          <div class=""><img src="{{ image }}" style="height: 4rem;width: 4rem;" /></div>
          <div class="d8p-h6 line-height-15 color-white mt-2">{{ sender }}</div>
        </div>
        <div class="col-2 flex-align-center text-center">
          <div class="">
            <img class="max-width-60" src="assets/icons-img/icon-creditbig2.png" />
          </div>
        </div>
        <div class="col-1 flex-align-center text-center">
          <div class="">
            <img class="max-width-40" src="assets/icons-img/linewhite1.png" />
          </div>
        </div>
        <div class="col-6 flex-align-center text-center flex-column">
          <div class="transaction-box p-3">
            <div class="d-flex flex-row mb-2">
              <div class="transact-amt">
                <span class="mr-2"><img src="assets/icons-img/icon-plus-white@2x.png" /></span>
                RM {{goldPrice}}
              </div>
              <span class="mt-3"><img class="wh-4-12" src="assets/icons-img/quicklinks-info-icon@2x.png" /></span>
            </div>
            <div class="d-flex flex-row mb-2">
              <div class="gold-view">
                <span class="mr-2"><img src="assets/icons-img/transfer-gold-debit@2x.png" /></span>
                {{goldSplit}} g Gold
              </div>
              <span class="mt-3"><img class="wh-4-12" src="assets/icons-img/info-iconlatest-gold@2x.png" /></span>
            </div>
            <div class="d-flex flex-row mb-2">
              <div class="transact-amt">
                <span class="mr-2"><img src="assets/icons-img/transfer-white-debit@2x.png"/></span>
                RM {{feeCharge}}
              </div>
              <span class="mt-3"><img class="wh-4-12" src="assets/icons-img/quicklinks-info-icon@2x.png" /></span>
            </div>
            <div class="d-flex flex-row mb-2">
              <div class="gold-view">
                <span class="mr-2"><img src="assets/icons-img/icon-minus-gold@2x.png" /></span>
                {{goldAmount}} g Gold
              </div>
              <span class="mt-3"><img class="wh-4-12" src="assets/icons-img/info-iconlatest-gold@2x.png" /></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid p-0">
  <div class="row no-gutters">
    <div class="col-12 subtitlebg">
      <div class="row no-gutters justify-content-center">
        <div class="col-12 col-xl-9">
          <div>SELLGOLD : {{goldAmount}} g Gold (999.9)</div>
          <img
            class="d-flex max-width-60 margin-zero-auto"
            src="assets/icons-img/linewhite2.png"
          />
          <div>Effective When Listed Gold is Purchased</div>
        </div>
      </div>
    </div>
  </div>
  <div class="row no-gutters">
    <div class="col-12">
      <div class="recipientview">
        <div class="row no-gutters justify-content-center">
          <div class="col-12 col-xl-6">
            <div class="row no-gutters">
              <div class="col-6 flex-align-center text-center flex-column">
                <div class="transaction-box flex-view-box">
                  <div class="d-flex flex-row mb-2">
                    <span class="mr-2">
                      <img
                        class="wh-20-20"
                        src="assets/icons-img/icon-info3.png"
                    /></span>
                    <div
                      class="summary-currency-view justify-content-between"
                      style="
                        min-width: 125px;
                        min-height: 28px;
                        padding: 0 0.4rem;
                      "
                    >
                      <span class="mr-2"
                        ><img src="assets/icons-img/icon-debitsmall3.png"
                      /></span>
                      RM {{goldPrice}}
                    </div>
                  </div>
                  <div class="d-flex flex-row mb-2">
                    <span class="mr-2">
                      <img
                        class="wh-20-20"
                        src="assets/icons-img/icon-info3.png"
                    /></span>
                    <div
                      class="gold-view justify-content-between"
                      style="min-width: 125px; min-height: 30px"
                    >
                      <span class="mr-2"
                        ><img src="assets/icons-img/icon-creditsmall1.png"
                      /></span>
                      {{goldSplit}} g Gold
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-1 flex-align-center text-center">
                <div class="">
                  <img
                    class="max-width-60"
                    src="assets/icons-img/linegrey2.png"
                  />
                </div>
              </div>
              <div class="col-2 flex-align-center text-center">
                <div class="">
                  <img
                    class="max-width-60"
                    src="assets/icons-img/icon-debitbig2.png"
                  />
                </div>
              </div>
              <div class="col-3 flex-align-center text-center flex-column">
                <div class="d8p-h6 font-weight-bold mb-1">BUYER</div>
                <div class="goldcoin-box">
                  <img
                    class="max-width-60"
                    src="assets/icons-img/gold-coin.png"
                  />
                </div>
                <div class="d8p-h6 line-height-17 mt-2">
                  Exchange Participant
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="container-fluid">
  <div class="row no-gutters">
    <div class="col-4"></div>
    <div class="col-8">
      <div class="dashboard-header">
        <div class="text-center">
          <img
          class="w-50 mt-4"
          src="assets/icons-img/d-8plogo without word@2x.png"
          routerLink="/dashboard"
          style="margin-left: 1rem;padding-top: 0.25rem;"
          />
        </div>
        <!-- <div><img class="mt-3 mr-1" src="assets/icons-img/notification-icon.png" routerLink="/recent-transactions" /></div> -->
        <div>
          <img
          class="mt-4 mr-3 pt-2 pr-2"
          src="assets/icons-img/notification-off-icon@2x.png"
          routerLink="/recent-transactions"
          style="width: 1.75rem;"
          />
        </div>
        <div class="text-right">
          <div class="headergoldbox d-flex" style="margin-top: 1.5rem; margin-right: 0.5rem;">
            <div class="gram-txt">
              <div class="font-arial color-white pt-2">0.</div>
              <div class="font-arial color-white pt-1 border-top-white" style="width: 50px;">0001 g</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="row no-gutters min-height-132">
    <div class="col-1 d-flex justify-content-center align-items-center">
      <img class="max-width-60 pt-5" src="assets/icons-img/icon-left1.png" style="margin-top: 1.5rem; margin-left: 0.25rem;"/>
    </div>
    <div class="col-10">
      <div class="text-center">
        <img
          class="max-width-100 vertical-align-bottom"
          src="assets/icons-img/linegrey1.png"
        />
      </div>

      <!--  -->
      <mat-tab-group>
        <mat-tab label="MYR" class="min-height-132">
          <!-- <div class="d8p-normal-text font-arial text-center mt-3">D8-P Acc. No.: 812342289912</div> -->
          <div class="d8p-normal-text font-arial text-center mt-3 text-secondary">
            D8-P Acc. No.: {{ cardNumber }}
          </div>
          <div class="d8p-h3 font-arial text-center mt-4">
            {{ currencyType }}
            <span class="font-weight-bold">{{
              currentBalance | number: '1.2-2'
            }}</span>
          </div>
          <div class="dashboard-gold-box" *ngIf="activetransaction==true">
            <div class="summary-currency-view">
              <span class="mr-2"
                ><img src="assets/icons-img/icon-debitsmall3.png"
              /></span>
              RM 100.05
            </div>
            <div class="summary-gold-view">
              0.1001g Gold
              <span class="ml-2"
                ><img src="assets/icons-img/icon-creditsmall1.png"
              /></span>
            </div>
          </div>
        </mat-tab>
       <!-- normal -->
      <mat-tab disabled label="Normal" class="min-height-132">
      </mat-tab>
<!-- qr button -->
<mat-tab routerLink="/qr-code" label="QR" >
  <div class="row no-gutters justify-content-center">
    <div class="max-width-30 pt-3" routerLink="/qr-code"><img class="max-width-60" src="assets/icons-img/qrcode1.png" /></div>
  </div>
</mat-tab>
      </mat-tab-group>
    </div>
    <div class="col-1 d-flex justify-content-center align-items-center">
      <img class="max-width-60 pt-5" src="assets/icons-img/icon-right1.png" style="margin-top: 1.5rem; margin-right: 0.25rem;" />
    </div>
  </div>
</div>
